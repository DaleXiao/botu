name = "botu"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Gateway directive (Dale 2026-09-22 19:42): all image generation goes through the api-llm gateway (same value as icon-forge)
[vars]
LLM_GATEWAY_URL = "https://api-llm.openclawd.co"

[[kv_namespaces]]
binding = "BOTU_RL"
id = "5f93916e14d44bf687eaa1afc0ee336c"

# SPEC-435/T-736 v5: the DO executor lives in the companion worker botu-job-runner (Pages cannot host a DO class;
# the Pages-side DO binding must carry script_name — official wrangler-configuration docs, 2026-06-25).
# All other keys untouched (frozen zone: KV id / compatibility / name).
[[durable_objects.bindings]]
name = "JOB_RUNNER"
class_name = "JobRunner"
script_name = "botu-job-runner"
