name = "botu-job-runner"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Gateway 指令（Dale 2026-09-22 19:42）：DO 内出图走 api-llm gateway；
# LLM_SERVICE_TOKEN = worker secret（wrangler secret put LLM_SERVICE_TOKEN --name botu-job-runner，零回显）
[vars]
LLM_GATEWAY_URL = "https://api-llm.openclawd.co"

[[kv_namespaces]]
binding = "BOTU_RL"
id = "5f93916e14d44bf687eaa1afc0ee336c"

[[durable_objects.bindings]]
name = "JOB_RUNNER"
class_name = "JobRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JobRunner"]

# SPEC-440/T-742：service binding 直连 api-llm-worker（同 account 4aa1ef6915a58d0680a9ebcf2047683b），
# 绕过 CF edge ~100s 墙根治 524；仅用于 gateway POST 腿，图片下载腿仍走全局 fetch
[[services]]
binding = "API_LLM"
service = "api-llm-worker"
