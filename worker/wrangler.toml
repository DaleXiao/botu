name = "botu-job-runner"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Gateway directive (Dale 2026-09-22 19:42): image generation inside the DO goes through the api-llm gateway;
# LLM_SERVICE_TOKEN = worker secret (wrangler secret put LLM_SERVICE_TOKEN --name botu-job-runner, zero echo)
[vars]
LLM_GATEWAY_URL = "https://api-llm.openclawd.co"

[[kv_namespaces]]
binding = "BOTU_RL"
id = "5f93916e14d44bf687eaa1afc0ee336c"

[[durable_objects.bindings]]
name = "JOB_RUNNER"
class_name = "JobRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JobRunner"]

# SPEC-440/T-742: service binding straight into api-llm-worker (same account, 4aa1ef6915a58d0680a9ebcf2047683b),
# bypassing the CF edge ~100s wall to eliminate 524s at the root; used only for the gateway POST leg, the image-download leg still uses global fetch
[[services]]
binding = "API_LLM"
service = "api-llm-worker"
